name: Backend CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: videocall
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: videocall_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U videocall -d videocall_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://videocall:ci-only-password@127.0.0.1:5432/videocall_test
      TEST_DATABASE_URL: postgresql+asyncpg://videocall:ci-only-password@127.0.0.1:5432/videocall_test
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e ".[test]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Verify Alembic migrations
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - run: pytest --cov=app
      - run: docker build .
