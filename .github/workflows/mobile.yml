name: Mobile CI

on:
  push:
    paths:
      - 'mobile/**'
      - 'client/js/webrtc.js'
      - 'client/js/live.js'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'client/js/webrtc.js'
      - 'client/js/live.js'
      - '.github/workflows/mobile.yml'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx --no-install expo export --platform android --platform ios --max-workers 2
