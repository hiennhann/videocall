<!doctype html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trang chủ · Videocall</title>
  <link rel="stylesheet" href="/client/css/tokens.css">
  <link rel="stylesheet" href="/client/css/base.css">
  <link rel="stylesheet" href="/client/css/components.css">
  <link rel="stylesheet" href="/client/styles.css">
  <link rel="icon" href="data:,">
  <script src="/client/vendor/socket.io.min.js" defer></script>
  <script type="module" src="/client/js/lobby.js"></script>
</head>
<body data-page="home">
  <a class="skip-link" href="#main" data-i18n="skip">Đến nội dung chính</a>
  <div class="workspace">
    <aside class="app-sidebar">
      <a class="brand" href="/lobby" aria-label="Trang chủ"><span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="/client/icons/sprite.svg#video"></use></svg></span><span class="sidebar-label" data-project-name>Videocall</span></a>
      <nav aria-label="Điều hướng"><ul class="menu-list">
        <li><a class="menu-item" href="/lobby" aria-current="page" aria-label="Trang chủ"><svg class="icon" aria-hidden="true"><use href="/client/icons/sprite.svg#home"></use></svg><span class="sidebar-label">Trang chủ</span></a></li>
        <li><a class="menu-item" href="/rooms" aria-label="Phòng của tôi"><svg class="icon" aria-hidden="true"><use href="/client/icons/sprite.svg#video"></use></svg><span class="sidebar-label">Phòng của tôi</span></a></li>
        <li><a class="menu-item" href="/account" aria-label="Tài khoản"><svg class="icon" aria-hidden="true"><use href="/client/icons/sprite.svg#users"></use></svg><span class="sidebar-label">Tài khoản</span></a></li>
      </ul></nav>
      <div class="sidebar-account"><p class="eyebrow">VIDEOCALL WORKSPACE</p><p class="text-small muted" data-i18n="lobbySidebarNote">Một nơi cho mọi cuộc trò chuyện.</p></div>
    </aside>
    <div class="workspace-body">
      <header class="topbar"><div class="shell"><span class="eyebrow" data-i18n="workspace">Không gian của bạn</span><a class="brand mobile-brand" href="/lobby"><span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="/client/icons/sprite.svg#video"></use></svg></span><span data-project-name>Videocall</span></a><div class="header-actions"><label class="theme-picker"><span data-i18n="theme">Giao diện</span><select data-theme-select aria-label="Giao diện"><option value="light" data-i18n="light">Sáng</option><option value="dark" data-i18n="dark">Tối</option><option value="system" data-i18n="system">Theo hệ thống</option></select></label><button id="logout" class="secondary" type="button">Đăng xuất</button></div></div></header>
      <main class="workspace-main" id="main" tabindex="-1">
        <div class="heading-row"><div><p class="eyebrow" data-i18n="workspace">Không gian của bạn</p><h1 id="page-title" data-i18n="lobbyHeadline">Trang chủ</h1><p data-i18n="homeDescription"></p></div></div>
        <p id="message" class="notice" role="status" hidden></p>
        <div class="home-actions"><a class="card home-action" href="/rooms/join">
      <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="/client/icons/sprite.svg#video"></use></svg></span><h2 data-i18n="joinRoom"></h2><p class="muted" data-i18n="joinActionDescription"></p><span class="home-action__arrow"><svg class="icon" aria-hidden="true"><use href="/client/icons/sprite.svg#arrow"></use></svg></span>
    </a><a class="card home-action" href="/rooms/create" data-member-only hidden>
      <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="/client/icons/sprite.svg#plus"></use></svg></span><h2 data-i18n="createRoom"></h2><p class="muted" data-i18n="createActionDescription"></p><span class="home-action__arrow"><svg class="icon" aria-hidden="true"><use href="/client/icons/sprite.svg#arrow"></use></svg></span>
    </a><a class="card home-action" href="/rooms">
      <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="/client/icons/sprite.svg#history"></use></svg></span><h2 data-i18n="myRooms"></h2><p class="muted" data-i18n="roomsActionDescription"></p><span class="home-action__arrow"><svg class="icon" aria-hidden="true"><use href="/client/icons/sprite.svg#arrow"></use></svg></span>
    </a><a class="card home-action" href="/account">
      <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="/client/icons/sprite.svg#users"></use></svg></span><h2 data-i18n="account"></h2><p class="muted" data-i18n="accountActionDescription"></p><span class="home-action__arrow"><svg class="icon" aria-hidden="true"><use href="/client/icons/sprite.svg#arrow"></use></svg></span>
    </a></div>
        <footer class="workspace-footer"><p id="presence-state" class="status-pill" role="status">Đang kết nối…</p></footer>
      </main>
    </div>
  </div>
</body>
</html>
