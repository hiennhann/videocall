<!doctype html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cuộc gọi · Videocall</title>
  <link rel="stylesheet" href="/client/css/tokens.css">
  <link rel="stylesheet" href="/client/css/base.css">
  <link rel="stylesheet" href="/client/css/components.css">
  <link rel="stylesheet" href="/client/styles.css">
  <link rel="icon" href="data:,">
  <script src="/client/vendor/socket.io.min.js" defer></script>
  <script type="module" src="/client/js/room.js"></script>
</head>
<body class="call-page">
  <header class="topbar"><div class="shell"><a class="brand " href="/lobby"><span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="/client/icons/sprite.svg#video"></use></svg></span><span data-project-name>Videocall</span></a><div class="header-actions"><label class="theme-picker"><span data-i18n="theme">Giao diện</span><select data-theme-select aria-label="Giao diện"><option value="light" data-i18n="light">Sáng</option><option value="dark" data-i18n="dark">Tối</option><option value="system" data-i18n="system">Theo hệ thống</option></select></label><a class="text-link" href="/lobby"><svg class="icon" aria-hidden="true"><use href="/client/icons/sprite.svg#arrow"></use></svg> Về sảnh</a></div></div></header>
  <main class="call-workspace">
    <div class="workspace-main">
    <div class="heading-row"><div><h1 id="room-name">Phòng gọi</h1><p id="room-code"></p></div>
      <div class="controls call-meta">
        <button id="copy-code" type="button" class="secondary" hidden>Sao chép mã</button>
        <time id="call-timer" class="status-pill" aria-label="Thời gian trong cuộc gọi" hidden>00:00</time>
        <button id="stats-toggle" type="button" class="secondary" aria-expanded="false" aria-controls="network-panel" hidden>Chỉ số mạng</button>
      </div>
    </div>
    <section id="network-panel" class="panel" aria-labelledby="network-title" hidden>
      <div class="heading-row"><h2 id="network-title">Chỉ số mạng</h2><button id="copy-network" class="secondary" type="button">Sao chép báo cáo</button></div>
      <ul id="network-report" class="room-links"></ul>
    </section>
    <p id="message" role="status" class="notice" hidden></p>
    <section id="join-panel" class="panel precall" hidden>
      <div id="preview-area">
        <div class="precall-visual">
          <svg id="preview-placeholder" class="icon" aria-hidden="true"><use href="/client/icons/sprite.svg#video"></use></svg>
          <video id="preview" autoplay muted playsinline aria-label="Xem trước camera" hidden></video>
        </div>
        <div class="controls preview-controls">
          <button id="preview-start" type="button" class="secondary">Kiểm tra camera và mic</button>
          <button id="preview-mic" type="button" class="secondary" aria-pressed="true" hidden>Mic bật</button>
          <button id="preview-camera" type="button" class="secondary" aria-pressed="true" hidden>Camera bật</button>
        </div>
        <label id="preview-level" class="text-small" hidden>Mức mic <meter id="preview-meter" min="0" max="1" value="0"></meter></label>
        <p id="preview-error" class="field-error text-small" role="status" hidden></p>
      </div>
      <form id="enter-form">
        <h2>Chuẩn bị vào phòng</h2>
        <p id="join-as" class="muted text-small"></p>
        <p id="precall-room-status" class="muted text-small"></p>
        <div id="media-devices" hidden>
          <label>Camera <select id="video-device"></select></label>
          <label>Mic <select id="audio-device"></select></label>
          <label id="speaker-device-label" hidden>Loa <select id="speaker-device"></select></label>
        </div>
        <p id="invite-ready" class="notice" hidden>Bạn đang tham gia bằng lời mời.</p>
        <label id="password-label" hidden>Mật khẩu phòng <input name="password" type="password" maxlength="64" autocomplete="off"></label>
        <button id="use-password" class="secondary" type="button" hidden>Dùng mật khẩu phòng</button>
        <button id="enter-room" type="submit">Vào phòng</button>
      </form>
    </section>
    <section id="call-panel" class="room-content" hidden aria-label="Cuộc gọi">
      <div class="room-stage">
      <div id="video-grid" class="video-grid">
        <figure id="local-panel"><video id="local" autoplay muted playsinline></video><figcaption>Bạn</figcaption></figure>
        <figure id="local-screen-panel" class="shared-screen" hidden>
          <video id="local-screen" autoplay muted playsinline></video><figcaption>Màn hình của bạn</figcaption>
        </figure>
      </div>
      <section id="live-panel" class="panel" hidden aria-label="Livestream">
        <p id="live-status" role="status">Đang chờ người phát.</p>
        <video id="live-video" autoplay playsinline hidden></video>
        <button id="live-play" class="secondary" type="button" hidden>Phát video</button>
        <div class="controls">
          <button id="live-start" type="button" hidden>Bắt đầu phát</button>
          <button id="live-retry" type="button" class="secondary" hidden>Kết nối lại video</button>
        </div>
        <form id="live-speaker-form" hidden>
          <label>Người được phát <select name="peer_id"></select></label>
          <button type="submit">Cập nhật quyền phát</button>
        </form>
      </section>
      <div class="controls call-controls">
        <button id="mic" type="button" class="secondary" aria-pressed="true">Mic bật</button>
        <button id="camera" type="button" class="secondary" aria-pressed="true">Camera bật</button>
        <button id="screen" type="button" class="secondary" aria-pressed="false" hidden>Chia sẻ màn hình</button>
        <button id="room-drawer-toggle" type="button" class="secondary" aria-expanded="false" aria-controls="room-sidebar">Nội dung phòng</button>
        <button id="leave" type="button" class="danger">Rời phòng</button>
      </div>
      </div>
      <aside id="room-sidebar" class="room-sidebar" data-room-sidebar aria-label="Nội dung cuộc gọi">
      <button id="room-drawer-close" type="button" class="secondary">Đóng nội dung phòng</button>
      <div class="tabs" role="tablist" aria-label="Nội dung phòng">
        <button id="chat-tab" type="button" role="tab" aria-selected="true" aria-controls="chat-panel" tabindex="0">Tin nhắn</button>
        <button id="members-tab" type="button" role="tab" aria-selected="false" aria-controls="members-panel" tabindex="-1">Thành viên</button>
        <button id="invite-tab" type="button" role="tab" aria-selected="false" aria-controls="invite-panel" tabindex="-1" hidden>Mời</button>
      </div>
      <section id="members-panel" class="panel" role="tabpanel" aria-labelledby="members-tab" tabindex="0" hidden>
        <h2 id="members-title">Thành viên</h2>
        <ul id="room-members" class="room-links"></ul>
      </section>
      <section id="chat-panel" class="panel room-chat" role="tabpanel" aria-labelledby="chat-tab" tabindex="0">
        <h2 id="chat-title">Tin nhắn</h2>
        <button id="older-messages" type="button" class="secondary" hidden>Tin nhắn cũ hơn</button>
        <ol id="chat-messages" aria-label="Tin nhắn trong phòng"></ol>
        <p id="chat-error" class="notice error" role="status" hidden></p>
        <form id="chat-form" hidden>
          <label>Tin nhắn <input name="text" maxlength="2000" required autocomplete="off"></label>
          <button type="submit">Gửi</button>
        </form>
      </section>
      <section id="invite-panel" class="panel" role="tabpanel" aria-labelledby="invite-tab" tabindex="0" hidden>
        <h2>Mời bạn vào phòng</h2>
        <p id="invite-status" role="status"></p>
        <form id="call-invite-form" hidden>
          <label>Tìm bạn theo tên <input id="invite-search" type="search" maxlength="50"></label>
          <fieldset><legend>Chọn tối đa 20 người</legend><div id="invite-options"></div></fieldset>
          <div class="controls"><button type="submit">Gửi lời mời</button><button type="button" class="secondary" id="invite-copy">Sao chép mã phòng</button></div>
        </form>
      </section>
      </aside>
    </section>
    <footer class="call-status"><span id="call-state" class="status-pill" role="status">Chưa vào phòng</span></footer>
    </div>
  </main>
  <template id="peer-tile">
    <figure class="peer-camera">
      <div class="peer-video">
        <video autoplay playsinline></video>
        <button class="secondary play-peer" type="button" hidden>Phát video</button>
      </div>
      <figcaption>
        <strong class="peer-name"></strong>
        <small class="peer-status muted"></small>
        <small class="network-stats" hidden></small>
        <div class="peer-controls" hidden>
          <button type="button" data-kind="audio" class="secondary">Tắt mic</button>
          <button type="button" data-kind="video" class="secondary">Tắt camera</button>
        </div>
      </figcaption>
    </figure>
    <figure class="shared-screen peer-screen" hidden>
      <video autoplay muted playsinline></video><figcaption></figcaption>
    </figure>
  </template>
</body>
</html>
