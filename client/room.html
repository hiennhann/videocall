<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cuộc gọi · Videocall</title>
  <link rel="stylesheet" href="/client/styles.css">
  <script src="/client/vendor/socket.io.min.js" defer></script>
  <script type="module" src="/client/js/room.js"></script>
</head>
<body class="call-page">
  <header class="topbar"><div class="shell"><a class="brand" href="/lobby">Videocall</a><a href="/lobby">Về lobby</a></div></header>
  <main class="shell page">
    <div class="heading-row"><div><h1 id="room-name">Phòng gọi</h1><p id="room-code"></p></div><button id="copy-code" type="button" class="secondary" hidden>Sao chép mã</button></div>
    <p id="message" role="status" class="notice" hidden></p>
    <section id="join-panel" class="panel" hidden>
      <form id="enter-form">
        <label id="password-label" hidden>Mật khẩu phòng <input name="password" type="password" maxlength="64" autocomplete="off"></label>
        <button id="enter-room" type="submit">Vào phòng và bật camera</button>
      </form>
    </section>
    <section id="call-panel" hidden aria-label="Cuộc gọi">
      <div id="video-grid" class="video-grid">
        <figure id="local-panel"><video id="local" autoplay muted playsinline></video><figcaption>Bạn</figcaption></figure>
        <figure id="local-screen-panel" class="shared-screen" hidden>
          <video id="local-screen" autoplay muted playsinline></video><figcaption>Màn hình của bạn</figcaption>
        </figure>
      </div>
      <section id="live-panel" class="panel" hidden aria-label="Livestream">
        <p id="live-status" role="status">Đang chờ người phát.</p>
        <video id="live-video" autoplay playsinline hidden></video>
        <button id="live-play" class="secondary" type="button" hidden>Phát video</button>
        <div class="controls">
          <button id="live-start" type="button" hidden>Bắt đầu phát</button>
          <button id="live-retry" type="button" class="secondary" hidden>Kết nối lại video</button>
        </div>
        <form id="live-speaker-form" hidden>
          <label>Người được phát <select name="peer_id"></select></label>
          <button type="submit">Cập nhật quyền phát</button>
        </form>
      </section>
      <div class="controls">
        <button id="mic" type="button" class="secondary" aria-pressed="true">Mic bật</button>
        <button id="camera" type="button" class="secondary" aria-pressed="true">Camera bật</button>
        <button id="screen" type="button" class="secondary" aria-pressed="false" hidden>Chia sẻ màn hình</button>
        <button id="stats-toggle" type="button" class="secondary" aria-pressed="false">Chỉ số mạng</button>
        <button id="leave" type="button" class="danger">Rời phòng</button>
      </div>
      <section class="panel room-chat" aria-labelledby="chat-title">
        <h2 id="chat-title">Tin nhắn</h2>
        <button id="older-messages" type="button" class="secondary" hidden>Tin nhắn cũ hơn</button>
        <ol id="chat-messages" aria-label="Tin nhắn trong phòng"></ol>
        <p id="chat-error" class="notice error" role="status" hidden></p>
        <form id="chat-form" hidden>
          <label>Tin nhắn <input name="text" maxlength="2000" required autocomplete="off"></label>
          <button type="submit">Gửi</button>
        </form>
      </section>
    </section>
  </main>
  <template id="peer-tile">
    <figure class="peer-camera">
      <div class="peer-video">
        <video autoplay playsinline></video>
        <button class="secondary play-peer" type="button" hidden>Phát video</button>
      </div>
      <figcaption>
        <strong class="peer-name"></strong>
        <small class="peer-status muted"></small>
        <small class="network-stats" hidden></small>
        <div class="peer-controls" hidden>
          <button type="button" data-kind="audio" class="secondary">Tắt mic</button>
          <button type="button" data-kind="video" class="secondary">Tắt camera</button>
        </div>
      </figcaption>
    </figure>
    <figure class="shared-screen peer-screen" hidden>
      <video autoplay muted playsinline></video><figcaption></figcaption>
    </figure>
  </template>
</body>
</html>
