{% extends "base.html" %}
{% block content %}
<dl class="metrics">
  <div class="panel"><dt>Tài khoản</dt><dd>{{ total }}</dd></div>
  <div class="panel"><dt>Phòng đang mở</dt><dd>{{ rooms }}</dd></div>
  <div class="panel"><dt>Người trong phòng</dt><dd>{{ participants }}</dd></div>
  <div class="panel"><dt>Kết nối Socket.IO</dt><dd>{{ connections }}</dd></div>
</dl>
<section class="panel">
  <h2>Tài khoản mới trong 7 ngày</h2>
  <table><thead><tr><th>Ngày UTC</th><th>Số tài khoản mới</th></tr></thead>
    <tbody>{% for day, count in daily %}<tr><td>{{ day }}</td><td>{{ count }}</td></tr>{% endfor %}</tbody>
  </table>
</section>
{% endblock %}
