{% extends "base.html" %}
{% block content %}
<section class="panel">
  <form action="/admin/login" method="post">
    {% include "_csrf.html" %}
    <label>{{ "Email hoặc tên tài khoản demo" if request.app.state.demo_admin else "Email" }}
      <input name="email" type="{{ 'text' if request.app.state.demo_admin else 'email' }}" maxlength="254" autocomplete="username" required>
    </label>
    <label>Mật khẩu <input name="password" type="password" maxlength="128" autocomplete="current-password" required></label>
    <button>Đăng nhập</button>
  </form>
</section>
{% endblock %}
