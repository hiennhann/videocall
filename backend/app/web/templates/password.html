{% extends "base.html" %}
{% block content %}
<section class="panel narrow">
  <form action="/admin/password" method="post">
    {% include "_csrf.html" %}
    <label>Mật khẩu hiện tại <input name="current_password" type="password" maxlength="128" autocomplete="current-password" required></label>
    <label>Mật khẩu mới <input name="new_password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></label>
    <button>Đổi mật khẩu</button>
  </form>
</section>
{% endblock %}
