[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "videocall-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.1",
    "asyncpg==0.32.0",
    "email-validator==2.4.0",
    "fastapi==0.163.1",
    "httpx==0.28.1",
    "Jinja2==3.1.6",
    "limits==5.8.0",
    "pwdlib[argon2]==0.4.2",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "PyJWT==2.15.1",
    "python-multipart==0.0.33",
    "python-socketio==5.18.1",
    "slowapi==0.1.10",
    "SQLAlchemy[asyncio]==2.0.57",
    "uvicorn==0.54.0",
    "websockets==17.4",
]

[project.optional-dependencies]
sfu = [
    "aiortc==1.16.0",
    "aioice==0.13.0",
    "av==19.0.2",
]
test = [
    "aiohttp==3.14.5",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
