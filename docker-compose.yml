x-backend: &backend
  image: videocall-backend:dev
  build:
    context: .
    dockerfile: backend/Dockerfile

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?Set POSTGRES_APP_USER in .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set MIGRATION_DATABASE_URL in .env}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?Set POSTGRES_APP_USER in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    <<: *backend
    environment:
      ENV: ${ENV:?Set ENV in .env}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      TURN_SECRET: ${TURN_SECRET:?Set TURN_SECRET in .env}
      TURN_URLS: "${TURN_URLS:-stun:${TURN_HOST:-127.0.0.1}:3478,turn:${TURN_HOST:-127.0.0.1}:3478?transport=udp,turn:${TURN_HOST:-127.0.0.1}:3478?transport=tcp}"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-}
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-}
      TURN_CAPACITY_MBPS: ${TURN_CAPACITY_MBPS:-0}
      SFU_URL: http://sfu:8080
      AVATAR_STORAGE_DIR: /var/lib/videocall/avatars
    volumes:
      - avatars:/var/lib/videocall/avatars
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - default
      - turn
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4).close()"]
      interval: 10s
      timeout: 5s
      retries: 5

  coturn:
    image: coturn/coturn:4.19.0-r0
    environment:
      TURN_SECRET: ${TURN_SECRET:?Set TURN_SECRET in .env}
      TURN_HOST: ${TURN_HOST:-127.0.0.1}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        relay_ip="$$(hostname -i)" &&
        exec turnserver -n --realm=videocall.local --use-auth-secret
        --static-auth-secret="$$TURN_SECRET" --external-ip="$$TURN_HOST/$$relay_ip"
        --listening-ip=0.0.0.0 --relay-ip="$$relay_ip" --min-port=49152 --max-port=49162
        --fingerprint --no-tls --no-tcp-relay --no-multicast-peers
        --user-quota=4 --total-quota=10 --log-file=stdout
    ports:
      - "${TURN_HOST:-127.0.0.1}:3478:3478/udp"
      - "${TURN_HOST:-127.0.0.1}:3478:3478/tcp"
      - "${TURN_HOST:-127.0.0.1}:49152-49162:49152-49162/udp"
    networks:
      - turn
    healthcheck:
      test: ["CMD", "turnutils_stunclient", "-p", "3478", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5

  sfu:
    image: videocall-sfu:dev
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: sfu
    environment:
      TURN_SECRET: ${TURN_SECRET:?Set TURN_SECRET in .env}
      SFU_HOST: ${SFU_HOST:-127.0.0.1}
      SFU_TURN_URL: ${SFU_TURN_URL:-}
    sysctls:
      net.ipv4.ip_local_port_range: "40000 40127"
    ports:
      - "${SFU_HOST:-127.0.0.1}:40000-40127:40000-40127/udp"
    networks:
      - turn
    cpus: 1.0
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4).close()"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  turn:

volumes:
  pgdata:
  avatars:
